[package]
name = "wasm-engine"
version = "0.1.0"
edition = "2021"

[lib] 
crate-type = ["cdylib"]

[dependencies]
lopdf = "0.31.0"
wasm-bindgen = "0.2"
image_crate = {package = "image", version = "0.24", features = ["png", "jpeg"] }
printpdf = { version = "0.6", default-features = false, features = ["image"]}
serde-wasm-bindgen = "0.4"
serde = { version = "1.0", features = ["derive"] }